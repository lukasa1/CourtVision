# Stage 1 — YOLOv8m + ByteTrack. Locked values per PRD §9.1.

# Required at runtime (Hydra ??? = must-be-overridden):
input: ???              # path to a video clip
session_id: ???         # short id used in output filename
camera_id: ???          # short id used in output filename

# Default derived from the above. Override on the CLI if you want a different layout.
output: outputs/stage1/${session_id}/tracks_${session_id}_${camera_id}.json

model:
  name: yolov8m
  # Modal artifacts-volume path. _resolve_weights() falls back to the bare
  # name (ultralytics auto-download) when this file doesn't exist locally.
  weights: /artifacts/checkpoints/yolov8m.pt
  classes: [0]          # person
  conf: 0.4
  iou: 0.5
  imgsz: 1280

tracker:
  name: bytetrack
  cfg: bytetrack.yaml   # ultralytics' built-in
  # Optional per-run knob overrides for the bytetrack YAML. The sweep
  # harness writes to this dict. Empty → use bundled defaults verbatim.
  # Allowed keys: track_buffer, match_thresh, new_track_thresh,
  # track_high_thresh, track_low_thresh, fuse_score.
  # Calibrated winners (PRD §10 Phase B sweep): new_track_thresh 0.8,
  # fuse_score false.
  overrides:
    new_track_thresh: 0.8
    fuse_score: false

# Post-processing on the raw ByteTrack output (F15 persistence work):
# stitch fragmented tracks, then drop stationary non-players (refs).
# Calibrated on TrackID3x3 Indoor; lifts IDF1 ~+0.08-0.13. Remove this
# block to get raw tracks.
postprocess:
  stitch:
    max_gap_frames: 15
    base_radius_px: 60
  filter_non_players:
    min_players: 6
    speed_floor_frac: 0.00068   # ~1 px/frame at 720p; resolution-independent
