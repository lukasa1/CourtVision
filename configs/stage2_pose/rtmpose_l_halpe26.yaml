# Stage 2 — RTMPose-l Halpe-26 via rtmlib (ONNX). PRD §9.2 / decisions.md Decision 2.

input: null    # path to a video clip
tracks: null   # path to Stage 1 TrackSequence JSON
output: null   # path to write the Pose2DSequence JSON

model:
  name: rtmpose-l
  # ONNX export of the RTMPose-l body7-halpe26 256x192 checkpoint (same weights
  # as the specced .pth, hash 2abb7558). rtmlib downloads it on first use.
  onnx_model: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-l_simcc-body7_pt-body7-halpe26_700e-256x192-2abb7558_20230605.zip
  keypoint_format: halpe26
  num_keypoints: 26
  input_size: [192, 256]   # W, H per RTMPose convention
  backend: onnxruntime
  device: cpu              # CPU avoids the onnxruntime-gpu/CUDA matching that we just escaped
