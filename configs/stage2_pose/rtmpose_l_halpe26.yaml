# Stage 2 — RTMPose-l Halpe-26. PRD §9.2.

input: null    # path to a video clip
tracks: null   # path to Stage 1 TrackSequence JSON
output: null   # path to write the Pose2DSequence JSON

model:
  name: rtmpose-l
  # Model config is resolved at runtime from the installed mmpose package's
  # bundled `.mim/configs` tree (must be the *halpe26* 26-kpt head, NOT the
  # coco-256x192 17-kpt config). Set cfg_path to override if auto-resolution
  # picks the wrong file on a given mmpose release. See rtmpose_inference._resolve_model_config.
  cfg_path: null
  weights: /artifacts/checkpoints/rtmpose_l_halpe26.pth
  keypoint_format: halpe26
  num_keypoints: 26
  device: cuda:0

inference:
  input_size: [192, 256]   # W, H per RTMPose convention
  batch_size: 32
