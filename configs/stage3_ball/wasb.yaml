# Stage 3 — WASB ball detection. PRD §9.3.

input: null         # path to a video clip
output: null        # path to write the Ball2DSequence JSON
session_id: clip
camera_id: cam

model:
  name: wasb-basketball
  weights: /artifacts/checkpoints/wasb_basketball.pth
  conf_threshold: 0.5   # WASB postprocessor score_threshold (its trained default)

# WASB online-tracker max per-frame displacement (px) for ball association.
max_disp: 300
# Windows processed per HRNet forward pass.
batch_size: 8
# Cap clip length (s) for quick runs; null = whole clip.
max_seconds: null
# WASB checkout on the dedicated Modal image (flags.md F9).
wasb_src: /opt/wasb/src
