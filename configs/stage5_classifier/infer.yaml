# Stage 5 — sliding-window inference. PRD §9.5.3.

ckpt: null
dataset: multisubjects    # or "finesports", "own_footage"

window:
  num_frames: 32
  stride: 4

ball_ascent_gate:
  enabled: true
  z_threshold_m: 3.0
  window_frames: 20

fusion:
  mode: late                # average per-camera probabilities

nms:
  iou_threshold: 0.5
  min_score: 0.3
